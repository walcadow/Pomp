# Pomp sunucusunu ve veritabanını tek komutla başlatır:
#   docker compose up -d --build
# Durdurmak için:
#   docker compose down
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pomp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pomp}
      POSTGRES_DB: pomp
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pomp:${DB_PASSWORD:-pomp}@db:5432/pomp
      JWT_SECRET: ${JWT_SECRET:-gelistirme-icin-gizli-anahtar-uretimde-mutlaka-degistirin}
      PUBLIC_URL: ${PUBLIC_URL:-}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: ${NODE_ENV:-development}
      # Yönetici paneli şifresi (http://localhost:3000/admin). Boşsa panel kapalıdır.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # E-posta gönderimi (EPOSTA_KURULUM.md). SMTP_HOST boşsa e-postalar /dev/emails sayfasında görünür.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Push bildirimleri (PUSH_KURULUM.md). Dosya yoksa bildirimler kapalıdır.
      FIREBASE_SERVICE_ACCOUNT_FILE: /app/firebase-service-account.json
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"

  # Ücretsiz Cloudflare tüneli: sunucuyu geçici bir https://...trycloudflare.com adresinden internete açar.
  # Yalnızca TUNEL.bat ile (profil: tunnel) çalışır; normal "docker compose up" ile başlamaz.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - api
    command: tunnel --no-autoupdate --url http://api:3000

volumes:
  dbdata:
  uploads:

# Oracle (yayin) sunucusu icin ek ayarlar. Ana docker-compose.yml ile birlikte kullanilir:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Bu dosyayi elle calistirmaniza gerek yok; ORACLE_YUKLE.command her seyi yapar.
services:
  db:
    # Veritabani internete acilmaz, yalnizca sunucu icinden erisilir.
    ports: !reset []

  api:
    # API dogrudan acilmaz; disaridan yalnizca Caddy (HTTPS) uzerinden erisilir.
    ports: !reset []
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${SITE_ADDRESS}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
